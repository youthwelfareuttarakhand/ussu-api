name: Inspect prod DB schema (one-off)

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: User details
        run: psql "$PROD_DIRECT_URL" -c "SELECT id, email, role FROM \"User\";"
        env:
          PROD_DIRECT_URL: ${{ secrets.PROD_DIRECT_URL }}
