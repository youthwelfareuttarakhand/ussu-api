name: Inspect prod DB schema (one-off)

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: List applied migrations
        run: psql "$PROD_DIRECT_URL" -c "SELECT migration_name, finished_at FROM _prisma_migrations ORDER BY started_at;"
        env:
          PROD_DIRECT_URL: ${{ secrets.PROD_DIRECT_URL }}
