name: Inspect prod DB schema (one-off)

on:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Delete non-admin data (Admission -> Student/Staff -> RefreshToken -> User)
        run: |
          psql "$PROD_DIRECT_URL" -c "DELETE FROM \"Admission\" WHERE \"studentId\" IN (SELECT id FROM \"Student\" WHERE \"userId\" IN (SELECT id FROM \"User\" WHERE role != 'ADMIN'));"
          psql "$PROD_DIRECT_URL" -c "DELETE FROM \"Student\" WHERE \"userId\" IN (SELECT id FROM \"User\" WHERE role != 'ADMIN');"
          psql "$PROD_DIRECT_URL" -c "DELETE FROM \"Staff\" WHERE \"userId\" IN (SELECT id FROM \"User\" WHERE role != 'ADMIN');"
          psql "$PROD_DIRECT_URL" -c "DELETE FROM \"RefreshToken\" WHERE \"userId\" IN (SELECT id FROM \"User\" WHERE role != 'ADMIN');"
          psql "$PROD_DIRECT_URL" -c "DELETE FROM \"User\" WHERE role != 'ADMIN';"
        env:
          PROD_DIRECT_URL: ${{ secrets.PROD_DIRECT_URL }}

      - name: Confirm remaining users
        run: psql "$PROD_DIRECT_URL" -c "SELECT id, email, role FROM \"User\";"
        env:
          PROD_DIRECT_URL: ${{ secrets.PROD_DIRECT_URL }}
