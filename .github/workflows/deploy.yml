name: Deploy to Azure Container Apps

on:
  push:
    branches: [prod]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run pending DB migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.PROD_DIRECT_URL }}

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build and push image
        run: |
          az acr build -r ussuprodacr -t ussu-api:${{ github.sha }} -t ussu-api:latest .

      - name: Deploy new revision
        run: |
          az containerapp update \
            -g ussu-prod-rg -n ussu-api \
            --image ussuprodacr.azurecr.io/ussu-api:${{ github.sha }} \
            --revision-suffix gh${{ github.run_number }}
