name: Deploy to Azure Container Apps (staging)

on:
  push:
    branches: [staging]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build and push image
        run: |
          az acr build -r ussuprodacr -t ussu-api-staging:${{ github.sha }} -t ussu-api-staging:latest .

      - name: Deploy new revision
        run: |
          az containerapp update \
            -g ussu-prod-rg -n ussu-api-staging \
            --image ussuprodacr.azurecr.io/ussu-api-staging:${{ github.sha }} \
            --revision-suffix gh${{ github.run_number }}
