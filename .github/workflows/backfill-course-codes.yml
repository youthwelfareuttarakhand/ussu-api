name: One-off - Backfill Course codes + roll numbers (prod)

on:
  workflow_dispatch: {}

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Backfill Course.code
        run: npx ts-node prisma/backfill-course-codes.ts
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.PROD_DIRECT_URL }}

      # Must run after Course.code above — roll number assignment looks up
      # each admission's course by name to find its code.
      - name: Backfill roll numbers
        run: npx ts-node prisma/backfill-roll-numbers.ts
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.PROD_DIRECT_URL }}
